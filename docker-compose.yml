services:
    oracle-db:
        build:
            context: .
            dockerfile: Dockerfile
        image: ztb-oracle-free:26ai
        container_name: ztb-oracle-db
        ports:
            - "1521:1521"
        environment:
            ORACLE_PWD: ZtbOracle123!
            ORACLE_CHARACTERSET: AL32UTF8
        volumes:
            - oracle_data:/opt/oracle/oradata
            - ./docker/oracle/startup:/opt/oracle/scripts/startup:ro
            - ./docker/oracle/setup:/opt/oracle/scripts/setup:ro
        restart: unless-stopped

volumes:
    oracle_data:
